# Pohja yhdelle säädökselle tai standardille. Kopioi nimellä <id>.yaml oikeaan kansioon.
# Kaikki käyttäjälle näkyvät tekstit kirjoitetaan sekä suomeksi (fi) että englanniksi (en).
id: ""                     # lyhyt tunniste, sama kuin tiedostonimi
type: ""                   # standard | eu-legislation | eu-policy | national-legislation | standard-in-development
